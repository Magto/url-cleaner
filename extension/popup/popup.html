<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>URL Cleaner</h1>
  <div class="label">Current</div>
  <div id="original" class="url"></div>
  <div class="label">Clean</div>
  <div id="cleaned" class="url clean"></div>
  <ul id="removed"></ul>
  <button id="copy">Copy clean URL</button>
  <label class="toggle">
    <input type="checkbox" id="autoclean"> Auto-clean on this site
  </label>
  <label class="toggle">
    <input type="checkbox" id="keepreferral"> Keep referral codes (e.g. tag=)
  </label>
  <script src="popup.js"></script>
</body>
</html>
