<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Broken chain: blue winged link escaping to the upper-left,
       gray tracking link left behind at the lower-right. -->

  <!-- blue link with golden wings -->
  <g transform="rotate(45 42 42)">
    <g fill="#f0a818">
      <!-- upper wing feathers -->
      <ellipse cx="38" cy="12" rx="19" ry="6" transform="rotate(-28 38 12)"/>
      <ellipse cx="34" cy="19" rx="16" ry="5.5" transform="rotate(-14 34 19)"/>
      <ellipse cx="31" cy="25" rx="13" ry="5"/>
      <!-- lower wing feathers -->
      <ellipse cx="38" cy="72" rx="19" ry="6" transform="rotate(28 38 72)"/>
      <ellipse cx="34" cy="65" rx="16" ry="5.5" transform="rotate(14 34 65)"/>
      <ellipse cx="31" cy="59" rx="13" ry="5"/>
    </g>
    <rect x="16" y="28" width="52" height="28" rx="14" fill="none"
          stroke="#2b7de9" stroke-width="11"/>
  </g>

  <!-- break fragments -->
  <polygon points="66,59 74,61 68,67" fill="#2b7de9"/>
  <polygon points="59,67 67,70 61,75" fill="#9aa2ad"/>

  <!-- gray link -->
  <g transform="rotate(45 94 94)">
    <rect x="68" y="80" width="52" height="28" rx="14" fill="none"
          stroke="#9aa2ad" stroke-width="11"/>
  </g>
</svg>
